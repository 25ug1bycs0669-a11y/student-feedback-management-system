<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7fb">
    <meta name="description" content="A thoughtful space for student feedback and better learning.">
    <title>Classvoice — Student Feedback</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" data-page="home" aria-label="Classvoice home">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>classvoice<span class="brand-period">.</span></span>

        <nav class="desktop-nav" aria-label="Main navigation">
          <a href="#how-it-works">How it works</a>
          <a href="#why-feedback">Why feedback</a>

        <div class="topbar-actions" id="topbar-actions">

        </a>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script>window.CLASSVOICE_API_BASE = window.CLASSVOICE_API_BASE || '/api';</script>
    <script src="/js/app.js" defer></script>
